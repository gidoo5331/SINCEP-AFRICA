<!-- SINCEP-Africa — Consortium Partners. Simple style modelled on the European Commission's Funding & Tenders portal,
     using the wording and partner details from the current Consortium Partners page. Elementor HTML-widget snippet. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .sincep-cp{
    --blue: #004494;
    --blue-dark: #003776;
    --blue-soft: #E6EEF7;
    --yellow: #FFD617;
    --ink: #1A1A1A;
    --ink-soft: #515560;
    --line: #D9DCE1;
    --bg: #F5F6F8;
    --africa: #2E7D32; --europe: #004494; --na: #B25E09;

    background: #fff;
    color: var(--ink);
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    position: relative;
    /* Cancel the Elementor container's padding (defaults to 10px) */
    margin-top: calc(-1 * var(--padding-top, 10px));
    margin-left: calc(-1 * var(--padding-left, 10px));
    margin-right: calc(-1 * var(--padding-right, 10px));
  }
  .sincep-cp *, .sincep-cp *::before, .sincep-cp *::after { box-sizing: border-box; }
  /* Theme heading styles can override ours, hence !important */
  .sincep-cp h1, .sincep-cp h2, .sincep-cp h3 {
    font-family: 'Inter', Arial, Helvetica, sans-serif !important;
    color: var(--ink); margin: 0 !important; padding: 0;
    letter-spacing: normal !important; text-transform: none !important;
  }
  .sincep-cp p { margin: 0; }
  .sincep-cp a { color: var(--blue); }
  .sincep-cp a:focus-visible, .sincep-cp button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .sincep-cp button { box-shadow: none; text-transform: none; letter-spacing: normal; }
  .sincep-cp table, .sincep-cp th, .sincep-cp td { border: none; margin: 0; background: none; }
  .sincep-cp .sr-only {
    position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .sincep-cp .wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }

  /* ===== Page header ===== */
  .sincep-cp .page-head { background: var(--bg); border-bottom: 1px solid var(--line); padding: 20px 0 36px; }
  .sincep-cp .crumbs { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0 0 22px; padding: 0; font-size: 14px; color: var(--ink-soft); }
  .sincep-cp .crumbs li { display: flex; align-items: center; gap: 6px; margin: 0; }
  .sincep-cp .crumbs li + li::before { content: "›"; color: #8A909A; }
  .sincep-cp .crumbs a { text-decoration: underline; text-underline-offset: 2px; }
  .sincep-cp .page-head h1 { font-size: 36px !important; font-weight: 700; line-height: 1.2 !important; }
  .sincep-cp .page-head .lede { margin-top: 12px; max-width: 75ch; font-size: 17px; color: var(--ink-soft); }
  .sincep-cp .page-head .accent { display: block; width: 48px; height: 4px; background: var(--yellow); margin-top: 18px; }

  /* ===== Filters ===== */
  .sincep-cp .main { padding: 32px 0 80px; }
  .sincep-cp .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; padding-bottom: 16px; }
  .sincep-cp .search { display: flex; flex: 1 1 300px; max-width: 400px; border: 1px solid #8A909A; background: #fff; }
  .sincep-cp .search:focus-within { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .sincep-cp .search input,
  .sincep-cp .search input:focus {
    flex: 1; min-width: 0; border: 0; outline: none; box-shadow: none; margin: 0;
    padding: 9px 10px; height: auto; font: inherit; font-size: 15px; color: var(--ink); background: transparent; border-radius: 0;
  }
  .sincep-cp .search input::placeholder { color: #6B7280; opacity: 1; }
  .sincep-cp .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .sincep-cp .search span { display: flex; align-items: center; padding: 0 10px; color: #fff; background: var(--blue); }
  .sincep-cp .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .sincep-cp .chip,
  .sincep-cp .chip:focus {
    padding: 7px 12px; font: inherit; font-size: 14px; font-weight: 600; line-height: 1.2; cursor: pointer;
    color: var(--blue); background: #fff; border: 1px solid var(--blue); border-radius: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sincep-cp .chip:hover { background: var(--blue-soft); color: var(--blue-dark); }
  .sincep-cp .chip[aria-pressed="true"],
  .sincep-cp .chip[aria-pressed="true"]:hover { background: var(--blue); color: #fff; }
  .sincep-cp .results-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 0; border-top: 2px solid var(--ink); }
  .sincep-cp .count { font-size: 15px; }
  .sincep-cp .count strong { font-size: 18px; }

  /* ===== Table ===== */
  .sincep-cp .table-wrap { border: 1px solid var(--line); }
  .sincep-cp table.dir { width: 100%; border-collapse: collapse; font-size: 15px; }
  .sincep-cp .dir th { text-align: left; padding: 11px 16px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 700; white-space: nowrap; }
  .sincep-cp .sort-btn,
  .sincep-cp .sort-btn:focus { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none; cursor: pointer; font: inherit; color: inherit; }
  .sincep-cp .sort-btn:hover { color: var(--blue); background: none; text-decoration: underline; }
  .sincep-cp .sort-btn svg { opacity: 0.35; }
  .sincep-cp th[aria-sort] .sort-btn { color: var(--blue); }
  .sincep-cp th[aria-sort] .sort-btn svg { opacity: 1; }
  .sincep-cp th[aria-sort="descending"] .sort-btn svg { transform: rotate(180deg); }
  .sincep-cp .dir td { padding: 12px 16px; border-top: 1px solid var(--line); vertical-align: middle; background: transparent; }
  .sincep-cp .dir tbody tr:first-child td { border-top: 0; }
  .sincep-cp .dir tbody tr:nth-child(even) td { background: #FAFBFC; }
  .sincep-cp .dir tbody tr:hover td { background: var(--blue-soft); }
  .sincep-cp .partner { display: flex; align-items: center; gap: 14px; }
  .sincep-cp .logo { flex-shrink: 0; width: 72px; height: 40px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid var(--line); padding: 4px 6px; }
  .sincep-cp .logo.on-dark { background: #0B1F3A; border-color: #0B1F3A; }
  .sincep-cp .logo img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .sincep-cp .logo .fb { font-size: 12px; font-weight: 700; color: var(--blue); }
  .sincep-cp .p-name a { font-weight: 600; text-decoration: none; }
  .sincep-cp .p-name a:hover { text-decoration: underline; text-underline-offset: 2px; }
  .sincep-cp .abbr { font-size: 13px; color: var(--ink-soft); }
  .sincep-cp .dir td.c-country, .sincep-cp .dir td.c-cont, .sincep-cp .dir td.c-role { white-space: nowrap; }
  .sincep-cp .dir td.c-leads { min-width: 190px; max-width: 240px; }
  .sincep-cp .cont { display: inline-flex; align-items: center; gap: 8px; }
  .sincep-cp .cont::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .sincep-cp .labels { display: flex; flex-wrap: wrap; gap: 4px; }
  .sincep-cp .label { display: inline-block; padding: 2px 8px; font-size: 12px; font-weight: 700; line-height: 1.5; text-transform: uppercase; letter-spacing: 0.04em; border-radius: 2px; background: #ECEEF1; color: var(--ink-soft); }
  .sincep-cp .label.coordinator { background: var(--blue); color: #fff; }
  .sincep-cp .label.scientific { background: var(--blue-soft); color: var(--blue-dark); }
  .sincep-cp .leads a { display: inline-flex; flex-direction: column; line-height: 1.3; text-decoration: none; }
  .sincep-cp .leads a b { font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  .sincep-cp .leads a small { font-size: 12.5px; color: var(--ink-soft); }
  .sincep-cp .muted { color: #8A909A; }
  .sincep-cp mark { background: #FFF2A8; color: inherit; padding: 0 1px; }
  .sincep-cp .none { padding: 40px 16px; text-align: center; color: var(--ink-soft); }
  .sincep-cp .none strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }

  /* ===== Responsive ===== */
  @media (max-width: 1024px) {
    .sincep-cp { margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); }
  }
  @media (max-width: 760px) {
    .sincep-cp .table-wrap { border: 0; }
    .sincep-cp .dir thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .sincep-cp .dir, .sincep-cp .dir tbody { display: block; width: 100%; }
    .sincep-cp .dir tr { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; border: 1px solid var(--line); padding: 14px; margin-bottom: 10px; }
    .sincep-cp .dir td, .sincep-cp .dir tbody tr:nth-child(even) td, .sincep-cp .dir tbody tr:hover td { display: block; padding: 0; border: 0; background: none; }
    .sincep-cp .dir td.c-partner { grid-column: 1 / -1; }
    .sincep-cp .dir td.c-country { grid-column: 1; }
    .sincep-cp .dir td.c-cont { grid-column: 2; }
    .sincep-cp .dir td.c-role { grid-column: 3; justify-self: end; }
    .sincep-cp .dir td.c-leads { grid-column: 1 / -1; padding-top: 8px; border-top: 1px solid var(--line); }
    .sincep-cp .dir td.c-leads.is-empty { display: none; }
  }
  @media (max-width: 600px) {
    .sincep-cp .wrap { padding: 0 18px; }
    .sincep-cp .page-head h1 { font-size: 28px !important; }
    .sincep-cp .page-head .lede { font-size: 16px; }
    .sincep-cp .search { max-width: none; flex-basis: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .sincep-cp * { transition: none !important; } }
</style>

<div class="sincep-cp" id="sincep-cp">
  <div class="page-head">
    <div class="wrap">
      <nav aria-label="Breadcrumb">
        <ol class="crumbs">
          <li><a href="/">Home</a></li>
          <li aria-current="page">Consortium Partners</li>
        </ol>
      </nav>
      <h1>Consortium Partners</h1>
      <p class="lede">21 partners across 17 countries working together to strengthen epidemiological preparedness and clinical trial capacity in sub-Saharan Africa.</p>
      <span class="accent" aria-hidden="true"></span>
    </div>
  </div>

  <div class="wrap main">
    <div class="toolbar">
      <label class="search">
        <span class="sr-only">Search partners</span>
        <input type="search" class="cp-q" placeholder="Search partners or countries…" autocomplete="off">
        <span aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      </label>
      <div class="chips" role="group" aria-label="Filter partners"></div>
    </div>

    <div class="results-bar">
      <div class="count" aria-live="polite"></div>
    </div>

    <div class="table-wrap">
      <table class="dir" aria-label="Consortium partners">
        <thead>
          <tr>
            <th scope="col" data-sort="name"><button type="button" class="sort-btn">Partner <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 2 L9 7 H1 Z" fill="currentColor"/></svg></button></th>
            <th scope="col" data-sort="country"><button type="button" class="sort-btn">Country <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 2 L9 7 H1 Z" fill="currentColor"/></svg></button></th>
            <th scope="col" data-sort="continent"><button type="button" class="sort-btn">Continent <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 2 L9 7 H1 Z" fill="currentColor"/></svg></button></th>
            <th scope="col">Role</th>
            <th scope="col">Leads</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  var root = document.getElementById('sincep-cp');
  if (!root || root.dataset.ready) return;
  root.dataset.ready = '1';

  var WP_URL = '/work-packages/';
  // Folder the partner logo files live in. In WordPress, set this to the Media Library folder the
  // sincep-partner-* files were uploaded to, e.g. "/wp-content/uploads/2026/11/".
  var LOGO_BASE = 'logos/partners/';

  /* DATA — names, countries, roles and websites as on the current Consortium Partners page.
     logo: file in LOGO_BASE ("" = abbreviation); dark: true for white logos shown on navy; leads: thematic area(s) led. */
  var partners = [
    { name: "EDCTP Association", abbr: "EDCTP-Assoc", country: "Netherlands", continent: "Europe", role: ["coordinator"], url: "https://www.global-health-edctp3.europa.eu", logo: "edctp-assoc.svg", leads: [9] },
    { name: "University of Navarra", abbr: "UNAV", country: "Spain", continent: "Europe", role: ["beneficiary"], url: "https://en.unav.edu", logo: "unav.svg" },
    { name: "Liverpool School of Tropical Medicine", abbr: "LSTM", country: "England", continent: "Europe", role: ["beneficiary"], url: "https://lstmed.ac.uk", logo: "lstm.svg", dark: true },
    { name: "University of Ghana", abbr: "UG", country: "Ghana", continent: "Africa", role: ["beneficiary"], url: "https://ug.edu.gh", logo: "ug.svg", leads: [6] },
    { name: "Kwame Nkrumah University of Science and Technology", abbr: "KNUST", country: "Ghana", continent: "Africa", role: ["beneficiary"], url: "https://knust.edu.gh", logo: "knust.png" },
    { name: "Groupe de Recherche Action en Sante SARL", abbr: "GRAS", country: "Burkina Faso", continent: "Africa", role: ["beneficiary"], url: "https://gras.bf", logo: "gras.png" },
    { name: "University of Gondar", abbr: "UOG", country: "Ethiopia", continent: "Africa", role: ["beneficiary"], url: "https://uog.edu.et", logo: "uog.png" },
    { name: "University of Calabar", abbr: "UniCal", country: "Nigeria", continent: "Africa", role: ["beneficiary"], url: "https://www.unical.edu.ng", logo: "unical.png" },
    { name: "Université Cheikh Anta Diop", abbr: "UCAD", country: "Senegal", continent: "Africa", role: ["beneficiary"], url: "https://www.ucad.sn", logo: "ucad.jpg" },
    { name: "The Registered Trustees of The Ifakara Health Institute", abbr: "IHI", country: "Tanzania", continent: "Africa", role: ["beneficiary"], url: "https://www.ihi.or.tz", logo: "ihi.png" },
    { name: "Makerere University", abbr: "MAKERERE", country: "Uganda", continent: "Africa", role: ["beneficiary"], url: "https://mak.ac.ug", logo: "makerere.png", dark: true, leads: [4] },
    { name: "Institut National de Santé Publique", abbr: "INSP-CI", country: "Ivory Coast", continent: "Africa", role: ["beneficiary"], url: "https://healthresearchwebafrica.org.za/en/cote_d_ivoire/keygroups_50", logo: "insp-ci.jpg" },
    { name: "Ghana Health Service", abbr: "DHRC", country: "Ghana", continent: "Africa", role: ["beneficiary"], url: "https://ghs.gov.gh", logo: "ghs.png", leads: [5] },
    { name: "Centre National de Recherche Scientifique et Technologique — IRSS", abbr: "CRUN", country: "Burkina Faso", continent: "Africa", role: ["beneficiary"], url: "https://crun.bf", logo: "crun.png", leads: [2] },
    { name: "Université des Sciences des Techniques et des Technologies de Bamako", abbr: "USTTB", country: "Mali", continent: "Africa", role: ["beneficiary"], url: "http://usttb.edu.ml", logo: "usttb.png" },
    { name: "Université de Kinshasa", abbr: "UNIKIN", country: "DRC", continent: "Africa", role: ["beneficiary"], url: "https://www.unikin.ac.cd", logo: "unikin.png" },
    { name: "Fundação Manhiça", abbr: "FM", country: "Mozambique", continent: "Africa", role: ["beneficiary"], url: "https://www.cismmanhica.org", logo: "fm.png" },
    { name: "Strathmore University", abbr: "STRATHMORE", country: "Kenya", continent: "Africa", role: ["beneficiary"], url: "https://strathmore.edu", logo: "strathmore.png", leads: [8] },
    { name: "INDEPTH Network", abbr: "INDEPTH", country: "Ghana", continent: "Africa", role: ["scientific", "beneficiary"], url: "https://www.indepth-network.org", logo: "indepth.png", leads: [1] },
    { name: "CTI Africa LLC — CTI-LifeHealth", abbr: "CTI", country: "USA / Uganda", continent: "North America", role: ["beneficiary"], url: "http://ctiafrica.com", logo: "cti.png", leads: [7] },
    { name: "Pandemic Preparedness Platform for Health and Emerging Infections Response", abbr: "PANTHER", country: "France", continent: "Europe", role: ["beneficiary"], url: "https://www.pantherhealth.org", logo: "panther.svg", leads: [3] }
  ];
  partners.forEach(function (p, i) { p.order = i; });

  // Thematic area names as on the current homepage
  var areaNames = {
    1: "Scientific Leadership, Partnership and Networking", 2: "Site Capacity Assessment and Infrastructure Strengthening",
    3: "Epidemic Preparedness, Disease Surveillance & Population Health", 4: "Ethics, Regulatory, and Pharmacovigilance",
    5: "Clinical Research and Trial Management", 6: "Social Impact", 7: "Data Science, Artificial Intelligence (AI) & Analytics",
    8: "Capacity Strengthening & Training", 9: "Project Management & Monitoring"
  };
  var roleLabels = { coordinator: "Coordinator", scientific: "Scientific Lead", beneficiary: "Beneficiary" };
  var continentColour = { "Africa": "var(--africa)", "Europe": "var(--europe)", "North America": "var(--na)" };

  // Filters, as on the current page
  var filters = [
    { label: 'All (' + partners.length + ')', test: function () { return true; } },
    { label: 'Coordinator', test: function (p) { return p.role.indexOf('coordinator') > -1; } },
    { label: 'Scientific Lead', test: function (p) { return p.role.indexOf('scientific') > -1; } },
    { label: 'Beneficiary', test: function (p) { return p.role.indexOf('beneficiary') > -1; } },
    { label: 'Africa', test: function (p) { return p.continent === 'Africa'; } },
    { label: 'Europe', test: function (p) { return p.continent === 'Europe'; } },
    { label: 'USA', test: function (p) { return p.continent === 'North America'; } }
  ];

  var tbody = root.querySelector('tbody');
  var q = root.querySelector('.cp-q');
  var countEl = root.querySelector('.count');
  var chipsEl = root.querySelector('.chips');
  var active = filters[0];
  var sort = { key: null, dir: 1 };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fold(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function hl(text, term) {
    if (!term) return esc(text);
    var i = fold(text).indexOf(term);
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
  }
  function logoHTML(p) {
    if (!p.logo) return '<span class="logo"><span class="fb">' + esc(p.abbr) + '</span></span>';
    return '<span class="logo' + (p.dark ? ' on-dark' : '') + '"><img src="' + esc(LOGO_BASE + 'sincep-partner-' + p.logo) + '" alt="" loading="lazy" ' +
      'onerror="this.parentNode.className=\'logo\';this.outerHTML=\'<span class=&quot;fb&quot;>' + esc(p.abbr) + '</span>\'"></span>';
  }

  // Filter buttons
  chipsEl.innerHTML = filters.map(function (f, i) {
    return '<button type="button" class="chip" data-i="' + i + '" aria-pressed="' + (f === active) + '">' + esc(f.label) + '</button>';
  }).join('');
  chipsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    active = filters[+b.dataset.i];
    chipsEl.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', c === b); });
    render();
  });

  // Sortable headers: ascending → descending → original order
  root.querySelectorAll('th[data-sort]').forEach(function (th) {
    th.querySelector('.sort-btn').addEventListener('click', function () {
      var key = th.dataset.sort;
      if (sort.key !== key) sort = { key: key, dir: 1 };
      else if (sort.dir === 1) sort.dir = -1;
      else sort = { key: null, dir: 1 };
      root.querySelectorAll('th[data-sort]').forEach(function (h) {
        if (h.dataset.sort === sort.key) h.setAttribute('aria-sort', sort.dir === 1 ? 'ascending' : 'descending');
        else h.removeAttribute('aria-sort');
      });
      render();
    });
  });

  function render() {
    var term = fold(q.value.trim());
    var list = partners.filter(active.test).filter(function (p) {
      return !term || fold(p.name + ' ' + p.abbr + ' ' + p.country + ' ' + p.continent).indexOf(term) > -1;
    });
    list.sort(function (a, b) {
      return sort.key ? (a[sort.key].localeCompare(b[sort.key]) * sort.dir || a.order - b.order) : a.order - b.order;
    });
    countEl.innerHTML = 'Showing <strong>' + list.length + '</strong> ' + (list.length === 1 ? 'partner' : 'partners');

    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="none"><strong>No partners found</strong>Try a different search term or filter.</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function (p) {
      var roles = '<span class="labels">' + p.role.map(function (r) { return '<span class="label ' + r + '">' + roleLabels[r] + '</span>'; }).join('') + '</span>';
      var leads = (p.leads || []).map(function (n) {
        return '<a href="' + WP_URL + '#area-' + n + '" title="' + esc(areaNames[n]) + '"><b>Area ' + n + ' →</b><small>' + esc(areaNames[n]) + '</small></a>';
      }).join('');
      return '<tr>' +
        '<td class="c-partner"><div class="partner">' + logoHTML(p) +
          '<div><div class="p-name"><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + hl(p.name, term) + '</a></div>' +
          '<div class="abbr">' + hl(p.abbr, term) + '</div></div></div></td>' +
        '<td class="c-country">' + hl(p.country, term) + '</td>' +
        '<td class="c-cont"><span class="cont" style="--c:' + continentColour[p.continent] + '">' + hl(p.continent, term) + '</span></td>' +
        '<td class="c-role">' + roles + '</td>' +
        '<td class="c-leads leads' + (leads ? '">' + leads : ' is-empty"><span class="muted" aria-hidden="true">—</span><span class="sr-only">None</span>') + '</td>' +
        '</tr>';
    }).join('');
  }

  q.addEventListener('input', render);
  render();
})();
</script>
